[package]
name = "apalis-dynamodb"
version = "0.1.0"
authors = ["Sandip Dey <sandip.dey1988@yahoo.com>"]
edition = "2021"
license = "MIT"


[dependencies]
apalis-core = { version = "0.7.4", default-features = false, features = [
    "sleep",
    "json",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
log = "0.4.30"
futures = "0.3.32"
async-stream = "0.3.6"
tokio = { version = "1.52.3", features = ["full"] }
aws-sdk-dynamodb = "1.113.0"
aws-config = "1.8.17"
serde_dynamo = { version = "4.3.0", default-features = false, features = [
    "aws-sdk-dynamodb+1",
] }
chrono = "0.4.44"
thiserror = "2.0.18"
tracing = "0.1"
uuid = { version = "1.23.1", features = ["v4", "fast-rng"] }

[dev-dependencies]
apalis = "0.7.4"
tracing-subscriber = "0.3"
dotenvy = "0.15.7"

[[example]]
name = "email_worker"
path = "examples/email_worker.rs"
